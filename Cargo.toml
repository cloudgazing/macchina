[package]
name = "macchina"
version = "6.4.0"
authors = ["Aziz Ben Ali <ba.tahaaziz@gmail.com>", "Marvin Haschker <marvin@haschker.me>", "Uttarayan Mondal <email@uttarayan.me>"]
edition = "2024"
description = "A system information fetcher with an emphasis on performance."
keywords = ["system", "fetch", "cli"]
repository = "https://github.com/Macchina-CLI/macchina"
license = "MIT"
readme = "README.md"
build = "build.rs"

[dependencies]
libmacchina = { git = "https://github.com/cloudgazing/libmacchina", branch = "macos-de", features = ["version"] }
bytesize = "2.3.1"
shellexpand = "3.1.2"
clap = { version = "4.6.1", features = ["derive"] }
atty= "0.2.14"
colored = "3.1.1"
rand = "0.10.1"
unicode-width = "0.2.2"
ansi-to-tui = "8.0.1"
dirs = "6.0.0"
toml = { version = "1.1.2", features = ["parse"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }

[build-dependencies.vergen]
version = "9.1.0"
default-features = false
features = ["build", "cargo", "rustc"]

[profile.release]
opt-level = 3
debug = false
lto = true
incremental = true
codegen-units = 1

[features]
openwrt = ["libmacchina/openwrt"]
